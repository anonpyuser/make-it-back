# Publishes the game to GitHub Pages on every push to main (no build step needed).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest src vendor icons _site/
          # PNG icons are kept in the repo as base64 text; decode them for the site
          for f in icons/b64/*.b64; do base64 -d "$f" > "_site/icons/$(basename "$f" .b64)"; done
          rm -rf _site/icons/b64
          touch _site/.nojekyll
          ls -la _site _site/icons
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
