# Publishes the game to GitHub Pages on every push to main.
# Pages serves the `gh-pages` branch. This job copies the static files there,
# decoding PNG icons and GLB models (kept in the repo as base64 text in */b64/).
# Don't edit gh-pages by hand: it is overwritten on every deploy.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the static site
        run: |
          SHA="${GITHUB_SHA::7}"
          printf "export const ASSET_VERSION = '%s';\n" "$SHA" > src/version.js
          mkdir _site
          cp -r index.html style.css manifest.webmanifest src vendor icons assets _site/
          # Cache-bust GLBs, CSS, and the module entry so iPhone / Home Screen Safari
          # does not keep a stale player.js or character after a deploy.
          sed -i "s/[?]v=dev/?v=${SHA}/g" _site/index.html
          for f in icons/b64/*.b64; do base64 -d "$f" > "_site/icons/$(basename "$f" .b64)"; done
          mkdir -p _site/assets
          for f in assets/b64/*.b64; do base64 -d "$f" > "_site/assets/$(basename "$f" .b64)"; done
          rm -rf _site/icons/b64 _site/assets/b64
          touch _site/.nojekyll
          ls -la _site _site/icons _site/assets
          echo "ASSET_VERSION=${SHA}"
      - name: Publish to the gh-pages branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7} from main"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
